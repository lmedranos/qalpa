# Main experiment configuration
# ⚠️  WARNING: File location: experiments/{experiment_name}/configs/experiment_config.yaml
# Define the experiment name
experiment_name: allostery
base_dataset_path: /data/horse/ws/miha493e-research_project/activediffusion/data/qm7x-aqm-gas-noP.hdf5
# ⚠️  WARNING: base_dataset_path must be set to a valid dataset path for this experiment 
  

# The code root directory (3 levels up from this file)
root: ../../../ 
Data_path: ${root}/Data
Experiments_path: ${root}/Experiments
Code_path: ${root}/EQMgen


# Code paths
code_paths:
  EQdiff: ${Code_path}/eqdiff/e3mol_aqm
  pipeline_blocks: ${Code_path}/pipeline_blocks
  actdiff_utils: ${Code_path}/utils
  scripts: ${Code_path}/scripts


# EQdiff scripts
EQdiff:
  split: ${code_paths.EQdiff}/experiments/data/aqm/split_data.py
  train: ${code_paths.EQdiff}/experiments/run_train.py
  generate: ${code_paths.EQdiff}/experiments/run_evaluation_qm.py

# Pipeline scripts
pipeline:
  SAScore: ${code_paths.pipeline_blocks}/calculate_sascore.py
  GeoRelax: ${code_paths.pipeline_blocks}/optimize_geometry.py
  PropCalc: ${code_paths.pipeline_blocks}/prop_calc.py
  PrePropCalc: ${code_paths.pipeline_blocks}/propcalc_preprocess.py
  PostPropCalc: ${code_paths.pipeline_blocks}/propcalc_postprocess.py
  MolFilter: ${code_paths.pipeline_blocks}/filter_molecules.py
  MolHDF5: ${code_paths.pipeline_blocks}/to_hdf5.py


# Utility scripts
utils:
  DataManager: ${code_paths.actdiff_utils}/data_manager.py
  Trajectory: ${code_paths.actdiff_utils}/trajectory.py
  Parallelize: ${code_paths.actdiff_utils}/parallelize.py
  MolCalculator: ${code_paths.actdiff_utils}/mol_calculate.py

# Run scripts
scripts:
  EQMgen_forward: ${code_paths.scripts}/forward.py
  EQMgen_backward: ${code_paths.scripts}/backward.py
  EQMgen_generate: ${code_paths.scripts}/generate.py
  EQMgen_calculate: ${code_paths.scripts}/calculate.py
  EQMgen_evaluate: ${code_paths.scripts}/evaluate.py


# Workflow pipeline configuration
pipeline:
  start_at: score_filter  # Step to start from
  blocks: [split, train, generate, score_filter, relax_geo, prop_calc, prop_filter, hdf5, compress]


# Data configuration
data:
  exp_data_path: ${Data_path}/data_${experiment_name}  

# Model and code paths
paths:
  config: ${root}/code/configs  # Path to config files

# Training and iteration configuration
training:
  num_iterations: 10
  current_iter: 0
  max_parallel_tasks: 1

# Generative model configuration
EQdiffParam:
  num_samples: 200
  n_nodes: 20
  batch_size: 32
  num_steps: 50
  
# Geometry optimization
geometry:
  optimizer: DFTB+  # Options: FHI-aims, DFTB+, EquiDTB
  calculate_forces: true
  
# query calculation
query:
  calculator: DFTB+  # Options: FHI-aims, EquiDTB, DFTB+
  properties: ["HLgap", "eMBD", "atNUM"]
  score: "SAScore"
  filter_scheme: [score, accuracy]
  filteration_threshold: 0.1

# Environment and system
system:
  seed: 42
 
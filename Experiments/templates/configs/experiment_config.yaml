# Experiment Configuration - All-in-One File
# Location: Experiments/templates/configs/experiment_config.yaml
#
# This single file consolidates:
# 1. Imports from root and framework configs (via defaults)
# 2. All experiment-specific settings and overrides

defaults:
  # Root-level defaults (global settings)
  - /global_config
  
  # src-level defaults (framework-specific)
  - /src/configs/src_paths@_global_
  - /src/configs/eqdiff_model@_global_

# ============================================================================
# HYDRA SEARCH PATH
# ============================================================================
# The absolute defaults above (/global_config, /src/configs/*) are resolved
# from the repository root. init_experiment.py injects the real path here.

hydra:
  searchpath:
    - file://@@REPO_ROOT@@

# ============================================================================
# EXPERIMENT METADATA
# ============================================================================

experiment_name: template_experiment
experiment:
  name: template_experiment
  description: "molecular generation experiment"
 
exp_config_path: ${paths.experiments}/${experiment_name}/configs/experiment_config.yaml

# ============================================================================
# DATA CONFIGURATION (EXPERIMENT-SPECIFIC)
# ============================================================================

base_dataset_path: template_dataset  

data:
  exp_data_path: ${paths.data}/${experiment_name}

# ============================================================================
# LOOP CONFIGURATION (EXPERIMENT OVERRIDES)
# ============================================================================

loop:
  num_iterations: 10
  current_iter: 0

pipeline:
  start_at: split
  blocks: [split, train, generate, score_filter, relax_geo, prop_calc, prop_filter, hdf5, compress]

max_parallel_tasks: 20 
processing_timeout_hours: 2

# ============================================================================
# Generative Model CONFIGURATION (EXPERIMENT OVERRIDES)
# ============================================================================

EQdiffParam:
  num_samples: 200
  batch_size: 40
  num_epochs: 50
  test_interval: 5                    # sampling eval (1000 mols) every k epochs; best_mol_stab.ckpt is only saved here
  context_mapping: True
  properties_list: ['HLgap', 'eMBD']            # Properties to track should be edited
  num_context_features: ${len:${EQdiffParam.properties_list}}
  dataset_root: ${paths.data}/${experiment_name}/diffusion_wdir/data/
  model_root: ${paths.data}/${experiment_name}/diffusion_wdir/model_registry/
  test_save_dir: ${paths.data}/${experiment_name}/diffusion_wdir/test/
  load_ckpt_from_pretrained: null
  save_dir: ${paths.experiments}/${experiment_name}/logs/ 
  dataset: aqm_qm7x            # (choose from 'qm9', 'drugs', 'aqm', 'aqm_qm7x', 'pcqm4mv2', 'pepconf', 'crossdocked')
  concat_datasets: true
  alpha: 0.2
  beta: 0.2                             # original dataset weight = beta * (weight of one middle dataset)
  samples_per_epoch: 5000               # draws per epoch once >1 dataset (iteration 0 always uses the full dataset_0); null = len(train)
  min_original_share: 0.1               # replay floor for dataset_0's share, taken from the newest dataset; 0 = off
  split_seed: 42                        # seed of the per-molecule train/val/test split


# ============================================================================
# MLFLOW (training/evaluation curves; synced from TensorBoard logs after training)
# ============================================================================
# UI:  <mlflow.python dir>/mlflow ui --backend-store-uri <tracking_uri> --port 5000

mlflow:
  enabled: true                         # sync after every training; needs an env with mlflow + tensorboard + matplotlib (see README: MLflow)
  python: /data/horse/ws/miha493e-research_project/miha493e-research_project-1785452511/topublish/EQMgen/conda_envs/env-qalpa-mlflow/bin/python
  tracking_uri: file://${paths.data}/mlruns     # one store for all experiments; experiment = experiment_name


# ============================================================================
# GEOMETRY OPTIMIZATION (EXPERIMENT OVERRIDES)
# ============================================================================
 
geometry:
  optimizer: DFTB+                      # Options: FHI-aims, DFTB+, EquiDTB
  calculate_forces: True
  model: ${code_paths.configs}/MACE_model_swa.model                           # Model to use for geometry optimization (if applicable)

# ============================================================================
# QUERY CONFIGURATION (EXPERIMENT-SPECIFIC)
# ============================================================================

query:
  trajectory_csv: ${paths.experiments}/${experiment_name}/configs/trajectory_*.csv
  props: ${EQdiffParam.properties_list}              # Properties to track
  scores: ["SAScore"]                   # Scores to track
  filter_scheme: [score, accuracy]      # Filtering scheme to apply
  filter_threshold: 0.2                 # Filteration threshold for accuracy

# ============================================================================
# PROPERTIES CALCULATION (EXPERIMENT OVERRIDES)
# ============================================================================

properties:
  calculator: DFTB+                     # Options: FHI-aims, EquiDTB, DFTB+
  model: ${code_paths.configs}/MACE_model_swa.model

# ============================================================================
# HDF5 CONFIGURATION
# ============================================================================

hdf5:
  appending_flag: True
  hdf5_iter_flag: False
  extra_properties_flag: False




  

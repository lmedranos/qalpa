# Location: EQMgen/configs/eqdiff_model.yaml
# EQdiff parameters

EQdiffParam:
  bond_model_guidance: false
  use_pos_norm: true
  bond_prediction: false

  seed: 42

  # batch_size 40 without adaptive, and 200 with adaptive
  batch_size: 200
  inference_batch_size: 70
  ema_decay: 0.999
  grad_clip_val: 10
  accum_batch: 1
  gamma: 0.99

  use_adaptive_loader: true
  remove_hs: false

  gpus: 2
  num_epochs: 40  
  test_interval: 40

  #EQGAT
  sdim: 256
  vdim: 256
  edim: 128
  num_layers: 12
  use_cross_product: false
  edge_mp: false
  fully_connected: true
  local_global_model: false
  vector_aggr: mean

  #DATA
  dataset: aqm
  dataset_root: path/to/diffusion/working/directory
  # DIFFUSION
  additional_feats: false
  continuous: false
  noise_scheduler: adaptive
  eps_min: 1.e-3
  beta_min: 1.e-4
  beta_max: 2.e-2
  timesteps: 500
  max_time: 06:00:00:00
  loss_weighting: snr_t

  #CONTEXT
  context_mapping: True
  num_context_features: 2
  properties_list: ['HLgap', 'eMBD']

  #LOGGING
  save_dir: path/to/logs/directory
  id: 0

  #LEARNING
  lr_scheduler: reduce_on_plateau
  lr: 2.e-4
  lr_min: 5.e-5 #used for cyclic scheduler
  lr_step_size: 5.e-5 #used for cyclic scheduler
  lr_factor: 0.75
  lr_patience: 50
  lr_cooldown: 0
  max_num_neighbors: 128
  weight_decay: 1.e-12

  #TESTING
  test_save_dir: path/to/test/directory

  num_workers: 8
  precision: 32
  load_ckpt_from_pretrained: path/to/last/checkpoint